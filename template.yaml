AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: >
  AnDTix - Africa-first, globally scalable serverless event registration
  and ticketing API.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod
    Description: Deployment environment for AnDTix.

Globals:
  Function:
    Runtime: python3.13
    Architectures:
      - x86_64
    MemorySize: 256
    Timeout: 10
    Environment:
      Variables:
        LOG_LEVEL: INFO

Resources:
  AnDTixApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      Description: AnDTix event registration and ticketing HTTP API.

  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Application
          Value: AnDTix
        - Key: Environment
          Value: !Ref Environment

  RegistrationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: registrationId
          AttributeType: S
        - AttributeName: email
          AttributeType: S
        - AttributeName: eventId
          AttributeType: S
      KeySchema:
        - AttributeName: registrationId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: EmailIndex
          KeySchema:
            - AttributeName: email
              KeyType: HASH
            - AttributeName: eventId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Application
          Value: AnDTix
        - Key: Environment
          Value: !Ref Environment

  GetEventsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/get_events/
      Handler: app.lambda_handler
      Description: Returns the available AnDTix events.
      Environment:
        Variables:
          EVENTS_TABLE: !Ref EventsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EventsTable
      Events:
        GetEvents:
          Type: HttpApi
          Properties:
            ApiId: !Ref AnDTixApi
            Path: /events
            Method: GET

  RegisterAttendeeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/register_attendee/
      Handler: app.lambda_handler
      Description: Registers an attendee for an AnDTix event.
      Environment:
        Variables:
          EVENTS_TABLE: !Ref EventsTable
          REGISTRATIONS_TABLE: !Ref RegistrationsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EventsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RegistrationsTable
      Events:
        RegisterAttendee:
          Type: HttpApi
          Properties:
            ApiId: !Ref AnDTixApi
            Path: /register
            Method: POST

  GetRegistrationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/get_registrations/
      Handler: app.lambda_handler
      Description: Returns registrations belonging to an attendee email.
      Environment:
        Variables:
          REGISTRATIONS_TABLE: !Ref RegistrationsTable
          EMAIL_INDEX: EmailIndex
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref RegistrationsTable
      Events:
        GetRegistrations:
          Type: HttpApi
          Properties:
            ApiId: !Ref AnDTixApi
            Path: /registrations/{email}
            Method: GET

  CancelRegistrationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/cancel_registration/
      Handler: app.lambda_handler
      Description: Cancels an attendee registration.
      Environment:
        Variables:
          REGISTRATIONS_TABLE: !Ref RegistrationsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RegistrationsTable
      Events:
        CancelRegistration:
          Type: HttpApi
          Properties:
            ApiId: !Ref AnDTixApi
            Path: /registration/{id}
            Method: DELETE

Outputs:
  ApiUrl:
    Description: Base URL of the deployed AnDTix API.
    Value: !Sub >
      https://${AnDTixApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Environment}

  EventsTableName:
    Description: Name of the AnDTix events table.
    Value: !Ref EventsTable

  RegistrationsTableName:
    Description: Name of the AnDTix registrations table.
    Value: !Ref RegistrationsTable