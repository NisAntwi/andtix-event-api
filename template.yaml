AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: >
  AnDTix - Africa-first, globally scalable serverless event registration
  and ticketing API.


# ==========================================================
# PARAMETERS
# ==========================================================

Parameters:

  Environment:
    Type: String
    Default: dev

    AllowedValues:
      - dev
      - test
      - prod

    Description: Deployment environment for AnDTix.


# ==========================================================
# GLOBAL SETTINGS
# ==========================================================

Globals:

  Function:
    Runtime: python3.13

    Architectures:
      - x86_64

    MemorySize: 256

    Timeout: 10

    Environment:
      Variables:
        LOG_LEVEL: INFO


# ==========================================================
# RESOURCES
# ==========================================================

Resources:


  # ========================================================
  # API GATEWAY
  # ========================================================

  AnDTixApi:
    Type: AWS::Serverless::HttpApi

    Properties:

      Description: >
        AnDTix event registration and ticketing HTTP API.

      CorsConfiguration:

        AllowOrigins:
          - "*"

        AllowHeaders:
          - "Content-Type"

        AllowMethods:
          - GET
          - POST
          - DELETE
          - OPTIONS


  # ========================================================
  # PUBLIC EVENTS TABLE
  # ========================================================

  EventsTable:
    Type: AWS::DynamoDB::Table

    Properties:

      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:

        - AttributeName: eventId
          AttributeType: S

      KeySchema:

        - AttributeName: eventId
          KeyType: HASH

      SSESpecification:
        SSEEnabled: true

      Tags:

        - Key: Application
          Value: AnDTix

        - Key: Environment
          Value: !Ref Environment


  # ========================================================
  # REGISTRATIONS TABLE
  # ========================================================

  RegistrationsTable:
    Type: AWS::DynamoDB::Table

    Properties:

      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:

        - AttributeName: registrationId
          AttributeType: S

        - AttributeName: email
          AttributeType: S

        - AttributeName: eventId
          AttributeType: S

      KeySchema:

        - AttributeName: registrationId
          KeyType: HASH

      GlobalSecondaryIndexes:

        - IndexName: EmailIndex

          KeySchema:

            - AttributeName: email
              KeyType: HASH

            - AttributeName: eventId
              KeyType: RANGE

          Projection:
            ProjectionType: ALL

      SSESpecification:
        SSEEnabled: true

      Tags:

        - Key: Application
          Value: AnDTix

        - Key: Environment
          Value: !Ref Environment


  # ========================================================
  # ORGANIZER EVENT SUBMISSIONS TABLE
  # ========================================================

  EventSubmissionsTable:
    Type: AWS::DynamoDB::Table

    Properties:

      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:

        - AttributeName: submissionId
          AttributeType: S

      KeySchema:

        - AttributeName: submissionId
          KeyType: HASH

      SSESpecification:
        SSEEnabled: true

      Tags:

        - Key: Application
          Value: AnDTix

        - Key: Environment
          Value: !Ref Environment

        - Key: Purpose
          Value: OrganizerEventSubmissions


  # ========================================================
  # GET EVENTS FUNCTION
  # ========================================================

  GetEventsFunction:
    Type: AWS::Serverless::Function

    Properties:

      CodeUri: src/get_events/

      Handler: app.lambda_handler

      Description: >
        Returns the available AnDTix events.

      Environment:

        Variables:
          EVENTS_TABLE: !Ref EventsTable

      Policies:

        - DynamoDBReadPolicy:
            TableName: !Ref EventsTable

      Events:

        GetEvents:

          Type: HttpApi

          Properties:

            ApiId: !Ref AnDTixApi

            Path: /events

            Method: GET


  # ========================================================
  # REGISTER ATTENDEE FUNCTION
  # ========================================================

  RegisterAttendeeFunction:
    Type: AWS::Serverless::Function

    Properties:

      CodeUri: src/register_attendee/

      Handler: app.lambda_handler

      Description: >
        Registers an attendee for an AnDTix event.

      Environment:

        Variables:

          EVENTS_TABLE: !Ref EventsTable

          REGISTRATIONS_TABLE: !Ref RegistrationsTable

      Policies:

        - DynamoDBReadPolicy:
            TableName: !Ref EventsTable

        - DynamoDBCrudPolicy:
            TableName: !Ref RegistrationsTable

      Events:

        RegisterAttendee:

          Type: HttpApi

          Properties:

            ApiId: !Ref AnDTixApi

            Path: /register

            Method: POST


  # ========================================================
  # GET REGISTRATIONS FUNCTION
  # ========================================================

  GetRegistrationsFunction:
    Type: AWS::Serverless::Function

    Properties:

      CodeUri: src/get_registrations/

      Handler: app.lambda_handler

      Description: >
        Returns registrations belonging to an attendee email.

      Environment:

        Variables:

          REGISTRATIONS_TABLE: !Ref RegistrationsTable

          EMAIL_INDEX: EmailIndex

      Policies:

        - DynamoDBReadPolicy:
            TableName: !Ref RegistrationsTable

      Events:

        GetRegistrations:

          Type: HttpApi

          Properties:

            ApiId: !Ref AnDTixApi

            Path: /registrations/{email}

            Method: GET


  # ========================================================
  # CANCEL REGISTRATION FUNCTION
  # ========================================================

  CancelRegistrationFunction:
    Type: AWS::Serverless::Function

    Properties:

      CodeUri: src/cancel_registration/

      Handler: app.lambda_handler

      Description: >
        Cancels an attendee registration.

      Environment:

        Variables:

          REGISTRATIONS_TABLE: !Ref RegistrationsTable

      Policies:

        - DynamoDBCrudPolicy:
            TableName: !Ref RegistrationsTable

      Events:

        CancelRegistration:

          Type: HttpApi

          Properties:

            ApiId: !Ref AnDTixApi

            Path: /registration/{id}

            Method: DELETE


  # ========================================================
  # ORGANIZER EVENT SUBMISSION FUNCTION
  # ========================================================

  SubmitEventFunction:
    Type: AWS::Serverless::Function

    Properties:

      CodeUri: src/submit_event/

      Handler: app.lambda_handler

      Description: >
        Receives event submissions from organizers and stores
        them for administrative approval.

      Environment:

        Variables:

          EVENT_SUBMISSIONS_TABLE: !Ref EventSubmissionsTable

      Policies:

        - DynamoDBCrudPolicy:
            TableName: !Ref EventSubmissionsTable

      Events:

        SubmitOrganizerEvent:

          Type: HttpApi

          Properties:

            ApiId: !Ref AnDTixApi

            Path: /organizer/events

            Method: POST


  # ========================================================
  # ADMIN APPROVE EVENT FUNCTION
  # ========================================================

  ApproveEventFunction:
    Type: AWS::Serverless::Function

    Properties:

      CodeUri: src/approve_event/

      Handler: app.lambda_handler

      Description: >
        Approves organizer event submissions and publishes
        approved events to the public AnDTix Events table.

      Environment:

        Variables:

          EVENT_SUBMISSIONS_TABLE: !Ref EventSubmissionsTable

          EVENTS_TABLE: !Ref EventsTable

      Policies:

        - DynamoDBCrudPolicy:
            TableName: !Ref EventSubmissionsTable

        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable


# ==========================================================
# OUTPUTS
# ==========================================================

Outputs:


  # ========================================================
  # API URL
  # ========================================================

  ApiUrl:

    Description: >
      Base URL of the deployed AnDTix API.

    Value: !Sub >
      https://${AnDTixApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}


  # ========================================================
  # EVENTS TABLE
  # ========================================================

  EventsTableName:

    Description: >
      Name of the AnDTix events table.

    Value: !Ref EventsTable


  # ========================================================
  # REGISTRATIONS TABLE
  # ========================================================

  RegistrationsTableName:

    Description: >
      Name of the AnDTix registrations table.

    Value: !Ref RegistrationsTable


  # ========================================================
  # EVENT SUBMISSIONS TABLE
  # ========================================================

  EventSubmissionsTableName:

    Description: >
      Name of the AnDTix organizer event submissions table.

    Value: !Ref EventSubmissionsTable


  # ========================================================
  # ADMIN APPROVAL FUNCTION
  # ========================================================

  ApproveEventFunctionName:

    Description: >
      Name of the AnDTix administrator approval Lambda.

    Value: !Ref ApproveEventFunction